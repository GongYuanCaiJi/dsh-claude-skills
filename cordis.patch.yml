# dsh-claude-skills — DSH bundle layer (#37)
#
# Registers the upstream alirezarezvani/claude-skills skill tree
# (pinned commit aa8d778811a557a2c28ccadda4cf3d0bd028a4cc, marketplace v2.9.0)
# as a repository-provided host `skill-filesystem` instance in the global
# skill layer, so the skills load in every DSH surface.
#
# Why a dedicated instance: DSH's skill registry is layered; host rows and
# repository plugins land in the global layer and every agent reads the
# merged result. A distinct providerName avoids colliding with a preset's
# default `filesystem` provider, and `includeDefaultRoots: false` keeps this
# instance scanning ONLY this bundle's own roots (it must not re-scan
# ~/.dsh/skills or project roots).
#
# Path resolution: in a bundle patch layer, baseUrl is the PROFILE directory
# ($DSH_HOME/profiles/<name>/), and `dsh plugin add` installs this package
# into <profile>/node_modules/dsh-claude-skills/, so each relative URL below
# resolves to a `skills/` directory inside the installed bundle.
#
# Excluded by design (cross-tool conversion trees, not canonical content):
# .codex/skills, .gemini/skills, .hermes/skills, .vibe/skills — those are
# generated copies for other coding agents and would duplicate the catalog.
- insert:
    - id: skill-filesystem-claude-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: claude-skills
        includeDefaultRoots: false
        customSkillDirs:
          - !!js process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-claude-skills/business-growth/skills/', baseUrl))  # 5 skills
          - !!js process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-claude-skills/business-operations/skills/', baseUrl))  # 7 skills
          - !!js process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-claude-skills/c-level-advisor/arquiteto-de-empresa/skills/', baseUrl))  # 1 skills
